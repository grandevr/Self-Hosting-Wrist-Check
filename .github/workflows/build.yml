name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP fetches platform 36 if missing.
      - uses: gradle/actions/setup-gradle@v4
      # No secrets.properties: the app is set up on the watch. This repo is public,
      # so never build with the real token here or upload an APK that contains it.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      # Release signing key from repository secrets, so the APK installs over earlier builds with
      # `adb install -r`. Without the secrets (forks, or before they're added) the release APK is
      # signed with the runner's debug key instead and won't install over a build signed with the key.
      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret: the release APK is signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      # Shrunk build (R8).
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Remove signing key
        if: always()
        run: rm -f release.jks keystore.properties
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wrist-check-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
