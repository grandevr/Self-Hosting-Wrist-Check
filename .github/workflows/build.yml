name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP fetches platform 36 if missing.
      - uses: gradle/actions/setup-gradle@v4
      # No secrets.properties: the app is set up on the watch. This repo is public,
      # so never build with the real token here or upload an APK that contains it.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      # Shrunk build (R8). No keystore.properties here, so it's signed with the runner's debug key.
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace
