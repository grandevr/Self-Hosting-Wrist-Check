name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # Placeholder secrets: CI only checks that the app compiles. This repo is public,
      # so never build with the real token here or upload an APK that contains it.
      - name: Placeholder secrets.properties
        run: cp secrets.properties.example secrets.properties
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
