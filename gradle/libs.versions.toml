[versions]
androidGradlePlugin = "9.0.0"
complicationsDataSource = "1.2.1"
zxing = "3.5.3"
kotlin = "2.2.10"
activityCompose = "1.10.1"
wearCompose = "1.5.6"

[libraries]
wear-complications-data-source = { group = "androidx.wear.watchface", name = "watchface-complications-data-source", version.ref = "complicationsDataSource" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
